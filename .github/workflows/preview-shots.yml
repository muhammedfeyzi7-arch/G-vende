# Web önizlemesinin ekran görüntülerini gerçek ağla (Supabase + harita karoları) alır ve
# "preview-shots" dalına yükler. Geliştirme ortamının ağı harita karolarına erişemediği için kullanılır.
name: preview-shots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/preview-shots.mjs, .github/workflows/preview-shots.yml, 'src/app/(tabs)/harita.tsx', 'src/features/map/**', 'src/features/emergency/**', 'src/app/(tabs)/acil.tsx']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm i --no-save --legacy-peer-deps playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx expo export -p web --output-dir dist
      - run: node scripts/preview-shots.mjs dist shots
      - name: Publish
        run: |
          cd shots
          git init -q
          git config user.name 'preview bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -qm "Önizleme: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:preview-shots
